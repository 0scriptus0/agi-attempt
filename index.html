<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lewi 1 — agent console</title>
<style>
  :root {
    --bg: #1B1F27;
    --panel: #242933;
    --panel-raised: #2C323E;
    --line: #3A4150;
    --text: #EDEAE3;
    --text-dim: #9AA1AE;
    --amber: #E8A33D;
    --teal: #5FA8A0;
    --err: #D9695F;
    --font-sans: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif;
    --font-mono: "SFMono-Regular", "Menlo", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
    gap: 10px;
  }

  header .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .model-tag {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  #flags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .flag-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 3px;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }

  .flag-pill.on {
    color: var(--amber);
    border-color: var(--amber);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    min-height: 0;
  }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    #tracePanel { border-top: 1px solid var(--line); max-height: 40vh; }
  }

  #chatPanel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--line);
  }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 6px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--panel-raised);
    border: 1px solid var(--line);
  }

  .msg.agent {
    align-self: flex-start;
    background: transparent;
    border-left: 2px solid var(--teal);
    padding-left: 12px;
    border-radius: 0;
  }

  .msg.agent .meta {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
  }

  .msg.system-note {
    align-self: center;
    color: var(--text-dim);
    font-size: 12.5px;
    font-family: var(--font-mono);
  }

  .msg.error {
    align-self: flex-start;
    color: var(--err);
    border-left: 2px solid var(--err);
    padding-left: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
  }

  #inputRow {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  #inputRow textarea {
    flex: 1;
    resize: none;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    padding: 10px 12px;
    height: 44px;
    max-height: 140px;
  }

  #inputRow textarea:focus {
    outline: none;
    border-color: var(--teal);
  }

  #inputRow button {
    background: var(--amber);
    color: #1B1F27;
    border: none;
    border-radius: 5px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  #inputRow button:disabled {
    background: var(--line);
    color: var(--text-dim);
    cursor: default;
  }

  #tracePanel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #tracePanel .traceHeader {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    display: flex;
    justify-content: space-between;
  }

  #traceLog {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .trace-empty {
    color: var(--text-dim);
  }

  .trace-entry {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    background: var(--panel);
  }

  .trace-entry .tool-name {
    color: var(--teal);
    font-weight: 600;
  }

  .trace-entry .step-tag {
    color: var(--text-dim);
    float: right;
  }

  .trace-entry pre {
    margin: 6px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
    max-height: 160px;
    overflow-y: auto;
  }

  .running-indicator {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    align-self: flex-start;
    padding-left: 12px;
  }

  .running-indicator::after {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 6px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Lewi 1</h1>
      <span class="model-tag" id="modelTag">connecting…</span>
    </div>
    <div id="flags"></div>
  </header>

  <main>
    <section id="chatPanel">
      <div id="thread">
        <div class="msg system-note">Send a message to start the agent loop. Every tool call it makes shows up in the trace panel on the right, in order.</div>
      </div>
      <div id="inputRow">
        <textarea id="input" placeholder="Ask Lewi 1 something…" rows="1"></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </section>

    <aside id="tracePanel">
      <div class="traceHeader">
        <span>TOOL TRACE</span>
        <span id="stepCount">0 steps</span>
      </div>
      <div id="traceLog">
        <div class="trace-empty">No tool calls yet.</div>
      </div>
    </aside>
  </main>
</div>

<script>
const API_BASE = window.location.protocol === "file:" ? "http://localhost:8000" : "";

const thread = document.getElementById("thread");
const traceLog = document.getElementById("traceLog");
const stepCount = document.getElementById("stepCount");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const modelTag = document.getElementById("modelTag");
const flagsEl = document.getElementById("flags");

let history = [];
let traceCleared = false;

async function loadConfig() {
  try {
    const res = await fetch(`${API_BASE}/config`);
    const cfg = await res.json();
    modelTag.textContent = cfg.model;
    flagsEl.innerHTML = "";
    Object.entries(cfg.feature_flags).forEach(([name, on]) => {
      const pill = document.createElement("span");
      pill.className = "flag-pill" + (on ? " on" : "");
      pill.textContent = name.replace("_", " ");
      flagsEl.appendChild(pill);
    });
  } catch (e) {
    modelTag.textContent = "api.py not reachable — is it running on :8000?";
  }
}

function addMessage(role, text, meta) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  if (meta) {
    const m = document.createElement("span");
    m.className = "meta";
    m.textContent = meta;
    div.appendChild(m);
  }
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

function addTraceEntries(traceItems, totalSteps) {
  if (!traceCleared) {
    traceLog.innerHTML = "";
    traceCleared = true;
  }
  traceItems.forEach((item, i) => {
    const entry = document.createElement("div");
    entry.className = "trace-entry";
    const resultPreview = typeof item.result === "string" ? item.result : JSON.stringify(item.result);
    entry.innerHTML = `<span class="tool-name">${item.tool}</span><span class="step-tag">call ${i + 1}</span>
      <pre>${escapeHtml(JSON.stringify(item.input, null, 2))}</pre>
      <pre>${escapeHtml(resultPreview.slice(0, 800))}</pre>`;
    traceLog.appendChild(entry);
  });
  stepCount.textContent = `${totalSteps} step${totalSteps === 1 ? "" : "s"}`;
  traceLog.scrollTop = traceLog.scrollHeight;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "44px";
  sendBtn.disabled = true;

  addMessage("user", text);
  history.push({ role: "user", content: text });

  const running = document.createElement("div");
  running.className = "running-indicator";
  running.textContent = "running agent loop";
  thread.appendChild(running);
  thread.scrollTop = thread.scrollHeight;

  try {
    const res = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    running.remove();

    if (!res.ok) {
      const errText = await res.text();
      addMessage("error", `Request failed (${res.status}): ${errText}`);
      return;
    }

    const data = await res.json();
    addMessage("agent", data.reply, `${data.steps} step(s) · stop: ${data.stop_reason}`);
    history.push({ role: "assistant", content: data.reply });
    addTraceEntries(data.trace, data.steps);
  } catch (e) {
    running.remove();
    addMessage("error", `Could not reach api.py: ${e.message}`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener("input", () => {
  input.style.height = "44px";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
sendBtn.addEventListener("click", send);

loadConfig();
</script>
</body>
</html>
