name: Validate Lewi training assets

on:
  push:
    branches: [main, lewi3-dataset-expansion]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize generated Lewi v4 datasets
        if: ${{ !startsWith(github.event.head_commit.message, '[bot] Generate Lewi v4') }}
        run: |
          python scripts/generate_lewi_v4_quality.py
          python scripts/generate_lewi_v4_preference.py
      - name: Commit generated Lewi v4 datasets
        if: ${{ github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[bot] Generate Lewi v4') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/reasoning/lewi_agentic_state_transition_sft_v4_generated.jsonl datasets/reasoning/lewi_agentic_state_transition_preference_v4_generated.jsonl
          if git diff --cached --quiet; then
            echo "Generated datasets are already up to date."
          else
            git commit -m "[bot] Generate Lewi v4 state-transition datasets"
            git push
          fi
      - name: Validate JSONL datasets and config
        run: python scripts/validate_training_data.py
      - name: Compile training pipeline
        run: python -m py_compile train.py
